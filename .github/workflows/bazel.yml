name: "Bazel Build & Test"

on:
  push:
    branches: ["main"]
    paths:
      - ".bazelrc"
      - "BUILD.bazel"
      - "MODULE.bazel"
      - ".cargo/config.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "tests/bazel_smoke.rs"
      - "components/jetstream_codegen/**"
      - "components/jetstream_error/**"
      - "components/jetstream_libc/**"
      - "components/jetstream_macros/**"
      - "components/jetstream_rpc/**"
      - "components/jetstream_wireformat/**"
      - ".github/workflows/bazel.yml"
  pull_request:
    branches: ["main"]
    paths:
      - ".bazelrc"
      - "BUILD.bazel"
      - "MODULE.bazel"
      - ".cargo/config.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "tests/bazel_smoke.rs"
      - "components/jetstream_codegen/**"
      - "components/jetstream_error/**"
      - "components/jetstream_libc/**"
      - "components/jetstream_macros/**"
      - "components/jetstream_rpc/**"
      - "components/jetstream_wireformat/**"
      - ".github/workflows/bazel.yml"

permissions:
  contents: read

jobs:
  bazel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-version: "1.x"
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-${{ runner.os }}
          external-cache: true
          repository-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}
      - name: Build Bazel targets
        run: bazel build //...
      - name: Run Bazel tests
        run: bazel test //:bazel_smoke_test
