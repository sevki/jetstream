name: "Rust Matrix Build & Test"
on:
  # Every pull request, not only those targeting `main`. A stacked PR
  # based on another branch used to run nothing but the benchmark job,
  # so five PRs carrying the whole of a change could be reviewed and
  # merged without one of these checks ever compiling them.
  pull_request:

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "on"

jobs:
  jetstream-wasm:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [stable]
        package: [jetstream_wireformat, jetstream_rpc]
    steps:
      - uses: actions/checkout@v3
      - name: Setup Rust ${{ matrix.rust }}
        uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ matrix.rust }}
          target: wasm32-unknown-unknown
          override: true
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Run sccache-cache only on non-release runs
        if: github.event_name != 'release' && github.event_name != 'workflow_dispatch'
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Set Rust caching env vars only on non-release runs
        if: github.event_name != 'release' && github.event_name != 'workflow_dispatch'
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
      - name: Build and test
        run: |
          cargo build -p ${{ matrix.package }} --verbose --target wasm32-unknown-unknown

  jetstream:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable, beta, nightly]
    steps:
      - uses: actions/checkout@v3
      - name: Setup Rust ${{ matrix.rust }}
        uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ matrix.rust }}
          override: true
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Run sccache-cache only on non-release runs
        if: github.event_name != 'release' && github.event_name != 'workflow_dispatch'
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Set Rust caching env vars only on non-release runs
        if: github.event_name != 'release' && github.event_name != 'workflow_dispatch'
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
      - name: Build and test
        shell: bash
        run: |
          cargo build -p jetstream --verbose
          # The whole workspace, not the umbrella package alone. Testing
          # only `-p jetstream` left ten crates uncovered, and hid
          # `jetstream_macros` failing to compile at all — 42 tests that
          # never ran and 9 snapshots nothing checked.
          #
          # jetstream_ufs is **Linux-only**, not merely Unix-only. It
          # defines `LinuxDirent64` over `libc::ino64_t` and
          # `libc::off64_t` — glibc LFS64 aliases that exist on neither
          # macOS nor Windows — and reads directories through
          # `std::os::unix::io::AsRawFd`. Nothing in the crate is
          # cfg-gated, and nothing depends on it: the umbrella crate does
          # not list it, it is a workspace member and no more. So
          # `cargo test -p jetstream` never built it, and widening to
          # `--workspace` compiled it off Linux for the first time.
          EXCLUDE=""
          if [ "${RUNNER_OS}" != "Linux" ]; then
            EXCLUDE="--exclude jetstream_ufs"
          fi
          # fuzz is a libFuzzer harness whose only target is declared
          # `test = false`, so `cargo test` builds it and runs nothing.
          # Kept on Linux, where the build still catches an API break in
          # the harness; dropped on Windows, where it buys nothing.
          if [ "${RUNNER_OS}" = "Windows" ]; then
            EXCLUDE="${EXCLUDE} --exclude fuzz"
          fi
          cargo test --workspace ${EXCLUDE} --verbose --all-features

  # Examples on stable only
  examples:
    needs: jetstream
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
          - os: windows-latest
          - os: macos-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Rust stable
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Run sccache-cache only on non-release runs
        if: github.event_name != 'release' && github.event_name != 'workflow_dispatch'
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Set Rust caching env vars only on non-release runs
        if: github.event_name != 'release' && github.event_name != 'workflow_dispatch'
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
      - name: generate certificates
        shell: bash
        run: cd certs && ./generate_certs.sh
      - name: Run example echo
        run: cargo run --example echo --features quic
      - name: Run example sqlite_mtls
        run: cargo run --example sqlite_mtls --features quic
      - name: Run example iroh_echo
        run: cargo run --example iroh_echo --features iroh
      - name: Run example session_lanes
        run: cargo run --example session_lanes
      - name: Run example quic_session
        run: cargo run --example quic_session --features quic
