name: "Rust Matrix Build & Test"
on:
  # Every pull request, not only those targeting `main`. A stacked PR
  # based on another branch used to run nothing but the benchmark job,
  # so five PRs carrying the whole of a change could be reviewed and
  # merged without one of these checks ever compiling them.
  pull_request:

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "on"

jobs:
  jetstream-wasm:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [stable]
        package: [jetstream_wireformat, jetstream_rpc]
    steps:
      - uses: actions/checkout@v3
      - name: Setup Rust ${{ matrix.rust }}
        uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ matrix.rust }}
          target: wasm32-unknown-unknown
          override: true
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Run sccache-cache only on non-release runs
        if: github.event_name != 'release' && github.event_name != 'workflow_dispatch'
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Set Rust caching env vars only on non-release runs
        if: github.event_name != 'release' && github.event_name != 'workflow_dispatch'
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
      - name: Build and test
        run: |
          cargo build -p ${{ matrix.package }} --verbose --target wasm32-unknown-unknown

  jetstream:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable, beta, nightly]
    steps:
      - uses: actions/checkout@v3
      - name: Setup Rust ${{ matrix.rust }}
        uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ matrix.rust }}
          override: true
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Run sccache-cache only on non-release runs
        if: github.event_name != 'release' && github.event_name != 'workflow_dispatch'
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Set Rust caching env vars only on non-release runs
        if: github.event_name != 'release' && github.event_name != 'workflow_dispatch'
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
      - name: Build and test
        shell: bash
        run: |
          cargo build -p jetstream --verbose
          # The whole workspace, not the umbrella package alone. Testing
          # only `-p jetstream` left ten crates uncovered, and hid
          # `jetstream_macros` failing to compile at all — 42 tests that
          # never ran and 9 snapshots nothing checked.
          #
          # Two members are excluded on Windows, and only there:
          #
          #   jetstream_ufs — a Unix filesystem server. It uses
          #     `std::os::unix::io::{AsRawFd, FromRawFd}` and `libc::uid_t`
          #     unconditionally, so it cannot compile for
          #     x86_64-pc-windows-msvc. Nothing depends on it: the
          #     umbrella crate does not, and it is a workspace member
          #     only. Widening to `--workspace` is what built it on
          #     Windows for the first time and turned this job red.
          #
          #   fuzz — a libFuzzer harness whose only target is declared
          #     `test = false`, so `cargo test` builds it and runs
          #     nothing. No signal to lose.
          EXCLUDE=""
          if [ "${RUNNER_OS}" = "Windows" ]; then
            EXCLUDE="--exclude jetstream_ufs --exclude fuzz"
          fi
          cargo test --workspace ${EXCLUDE} --verbose --all-features

  # Examples on stable only
  examples:
    needs: jetstream
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
          - os: windows-latest
          - os: macos-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Rust stable
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Run sccache-cache only on non-release runs
        if: github.event_name != 'release' && github.event_name != 'workflow_dispatch'
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Set Rust caching env vars only on non-release runs
        if: github.event_name != 'release' && github.event_name != 'workflow_dispatch'
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
      - name: generate certificates
        shell: bash
        run: cd certs && ./generate_certs.sh
      - name: Run example echo
        run: cargo run --example echo --features quic
      - name: Run example sqlite_mtls
        run: cargo run --example sqlite_mtls --features quic
      - name: Run example iroh_echo
        run: cargo run --example iroh_echo --features iroh
      - name: Run example session_lanes
        run: cargo run --example session_lanes
      - name: Run example quic_session
        run: cargo run --example quic_session --features quic
